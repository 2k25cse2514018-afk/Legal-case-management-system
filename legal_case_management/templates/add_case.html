{% extends 'base.html' %}
{% block title %}Add New Case - LegalEase{% endblock %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <a href="{{ url_for('dashboard') }}" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
        <h1><i class="fas fa-plus-circle"></i> Create New Case</h1>
    </div>
    
    <form method="POST" class="case-form">
        <div class="form-card">
            <h2 class="form-section-title"><i class="fas fa-info-circle"></i> Basic Information</h2>
            
            <div class="form-group">
                <label>Case Title *</label>
                <input type="text" name="title" required placeholder="e.g., Smith vs. Johnson Property Dispute" class="form-input">
            </div>
            
            <div class="form-group">
                <label>Description *</label>
                <textarea name="description" required rows="4" placeholder="Describe the case details, background, and key issues..." class="form-input"></textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Case Type *</label>
                    <select name="case_type" class="form-input" required>
                        <option value="Civil">🏛️ Civil</option>
                        <option value="Criminal">⚖️ Criminal</option>
                        <option value="Family">👨‍👩‍👧 Family</option>
                        <option value="Corporate">🏢 Corporate</option>
                        <option value="Property">🏠 Property</option>
                        <option value="Labor">👷 Labor</option>
                        <option value="Tax">💰 Tax</option>
                        <option value="IP">💡 Intellectual Property</option>
                        <option value="Other">📋 Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Priority</label>
                    <select name="priority" class="form-input">
                        <option value="Low">🟢 Low</option>
                        <option value="Medium" selected>🟡 Medium</option>
                        <option value="High">🟠 High</option>
                        <option value="Urgent">🔴 Urgent</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select name="status" class="form-input">
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="On Hold">On Hold</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="form-card">
            <h2 class="form-section-title"><i class="fas fa-landmark"></i> Court Details</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Court Name</label>
                    <input type="text" name="court_name" placeholder="e.g., District Court of Delhi" class="form-input">
                </div>
                <div class="form-group">
                    <label>Judge Name</label>
                    <input type="text" name="judge_name" placeholder="e.g., Hon. Justice Smith" class="form-input">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Opposing Party</label>
                    <input type="text" name="opposing_party" placeholder="Name of the opposing party" class="form-input">
                </div>
                <div class="form-group">
                    <label>Next Hearing Date & Time</label>
                    <input type="datetime-local" name="next_hearing" class="form-input">
                </div>
            </div>
        </div>
        
        {% if lawyers %}
        <div class="form-card">
            <h2 class="form-section-title"><i class="fas fa-user-tie"></i> Assign Lawyer</h2>
            <div class="form-group">
                <label>Select a Lawyer (Optional)</label>
                <select name="lawyer_id" class="form-input">
                    <option value="">-- No Lawyer Assigned --</option>
                    {% for lawyer in lawyers %}
                    <option value="{{ lawyer.id }}">{{ lawyer.full_name }} ({{ lawyer.email }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        {% endif %}
        
        <div class="form-actions">
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline">
                <i class="fas fa-times"></i> Cancel
            </a>
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-check"></i> Create Case
            </button>
        </div>
    </form>
</div>

<style>
.page-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}

.page-header {
    margin-bottom: 30px;
}

.back-link {
    display: inline-block;
    margin-bottom: 15px;
    color: #666;
    text-decoration: none;
    transition: color 0.3s ease;
}

.back-link:hover {
    color: #4CAF50;
}

.page-header h1 {
    margin: 0;
    color: #333;
    font-size: 28px;
}

.form-card {
    background: white;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.form-section-title {
    margin: 0 0 20px 0;
    padding-bottom: 10px;
    border-bottom: 2px solid #f0f0f0;
    color: #333;
    font-size: 20px;
}

.form-section-title i {
    color: #4CAF50;
    margin-right: 10px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: #555;
}

.form-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    transition: border-color 0.3s ease;
}

.form-input:focus {
    outline: none;
    border-color: #4CAF50;
    box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.1);
}

textarea.form-input {
    resize: vertical;
    font-family: inherit;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.form-actions {
    display: flex;
    gap: 15px;
    justify-content: flex-end;
    margin-top: 20px;
}

.btn {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
}

.btn-primary {
    background: #4CAF50;
    color: white;
}

.btn-primary:hover {
    background: #45a049;
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
}

.btn-outline {
    background: transparent;
    border: 1px solid #ddd;
    color: #666;
}

.btn-outline:hover {
    background: #f5f5f5;
    border-color: #999;
}

.btn-lg {
    padding: 12px 24px;
    font-size: 16px;
}

@media (max-width: 768px) {
    .page-container {
        padding: 15px;
    }
    
    .form-card {
        padding: 20px;
    }
    
    .form-row {
        grid-template-columns: 1fr;
        gap: 15px;
    }
    
    .form-actions {
        flex-direction: column;
    }
    
    .btn {
        justify-content: center;
    }
}
</style>
{% endblock %}
